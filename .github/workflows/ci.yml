name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Tests
        run: bun run test
      - name: Full demo smoke (deterministic planner)
        run: bun run demo:auto
      - name: Preserve Scenario A audit
        uses: actions/upload-artifact@v4
        with:
          name: scenario-a-audit
          path: artifacts/scenario-a.ndjson
          if-no-files-found: error
